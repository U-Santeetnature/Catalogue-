<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#050f06;--bg2:#0a1a0b;--bg3:#0f230f;
  --gold:#c9a84c;--gold2:#e8c96a;--green:#3db85a;--green2:#2d8f44;
  --text:#e8f0e9;--text2:#8fa88f;--text3:#4a6b4c;
  --border:rgba(255,255,255,.07);--border2:rgba(201,168,76,.2);
  --wa:#25D366;--r:14px;--r2:8px;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}

/* ── GRAIN TEXTURE ── */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.035'/%3E%3C/svg%3E");opacity:.4;pointer-events:none;z-index:0;}

/* ── HERO ── */
.hero{position:relative;padding:60px 20px 40px;text-align:center;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:500px;height:500px;background:radial-gradient(circle,rgba(61,184,90,.12) 0%,transparent 70%);pointer-events:none;}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(61,184,90,.1);border:1px solid rgba(61,184,90,.25);border-radius:30px;padding:5px 14px;font-size:.7rem;font-family:'DM Mono',monospace;color:var(--green);letter-spacing:.12em;text-transform:uppercase;margin-bottom:20px;animation:fadeDown.6s ease both;}
.hero-logo{font-size:3rem;margin-bottom:12px;animation:fadeDown.6s.1s ease both;display:block;}
.hero-title{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,6vw,2.8rem);font-weight:700;color:var(--gold);line-height:1.15;margin-bottom:8px;animation:fadeDown.6s.15s ease both;}
.hero-sub{font-size:.88rem;color:var(--text2);font-weight:300;margin-bottom:6px;animation:fadeDown.6s.2s ease both;}
.hero-addr{font-size:.72rem;color:var(--text3);font-family:'DM Mono',monospace;animation:fadeDown.6s.25s ease both;}

/* ── PANIER FLOTTANT ── */
.cart-fab{position:fixed;bottom:24px;right:20px;z-index:100;background:linear-gradient(135deg,var(--green2),var(--green));border:none;border-radius:50px;color:#fff;font-family:'DM Sans',sans-serif;font-weight:500;font-size:.88rem;padding:13px 20px;cursor:pointer;box-shadow:0 8px 32px rgba(61,184,90,.35);transition:all.25s;display:flex;align-items:center;gap:8px;}
.cart-fab:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(61,184,90,.5);}
.cart-count{background:var(--gold);color:#050f06;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;font-family:'DM Mono',monospace;}

/* ── SEARCH ── */
.search-wrap{max-width:520px;margin:0 auto 28px;padding:0 20px;animation:fadeDown.6s.3s ease both;}
.search-box{position:relative;}
.search-box input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:50px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;padding:12px 20px 12px 44px;outline:none;transition:border-color.2s;}
.search-box input:focus{border-color:rgba(61,184,90,.4);}
.search-box::before{content:'🔍';position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:.85rem;pointer-events:none;z-index:1;}

/* ── FILTRES ── */
.filters{display:flex;gap:8px;padding:0 20px;margin-bottom:24px;overflow-x:auto;scrollbar-width:none;animation:fadeDown.5s.35s ease both;}
.filters::-webkit-scrollbar{display:none;}
.filter-btn{flex-shrink:0;background:var(--bg2);border:1px solid var(--border);border-radius:30px;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:.76rem;padding:7px 16px;cursor:pointer;transition:all.2s;white-space:nowrap;}
.filter-btn.active,.filter-btn:hover{background:rgba(61,184,90,.12);border-color:rgba(61,184,90,.35);color:var(--green);}

/* ── FORMULES ── */
.section-title{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--gold);padding:0 20px;margin-bottom:14px;}
.formules-scroll{display:flex;gap:12px;padding:0 20px 4px;overflow-x:auto;scrollbar-width:none;margin-bottom:32px;}
.formules-scroll::-webkit-scrollbar{display:none;}
.formule-card{flex-shrink:0;width:180px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:14px;cursor:pointer;transition:all.2s;position:relative;overflow:hidden;}
.formule-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,168,76,.06),transparent);opacity:0;transition:opacity.2s;}
.formule-card:hover{border-color:rgba(201,168,76,.4);transform:translateY(-2px);}
.formule-card:hover::before{opacity:1;}
.formule-emoji{font-size:1.6rem;margin-bottom:8px;display:block;}
.formule-name{font-family:'Playfair Display',serif;font-size:.88rem;color:var(--gold);margin-bottom:4px;}
.formule-desc{font-size:.72rem;color:var(--text2);line-height:1.5;margin-bottom:10px;}
.formule-tags{display:flex;flex-wrap:wrap;gap:4px;}
.formule-tag{font-size:.62rem;background:rgba(61,184,90,.1);border:1px solid rgba(61,184,90,.2);color:var(--green);border-radius:20px;padding:2px 7px;}
.formule-apply{width:100%;margin-top:10px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.25);border-radius:6px;color:var(--gold);font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:500;padding:6px;cursor:pointer;transition:all.2s;}
.formule-apply:hover{background:rgba(201,168,76,.2);}

/* ── GRILLE PRODUITS ── */
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:0 20px;margin-bottom:120px;}
.prod-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;transition:all.25s;position:relative;overflow:hidden;animation:fadeUp.4s ease both;}
.prod-card::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(61,184,90,.08),transparent 70%);opacity:0;transition:opacity.3s;}
.prod-card:hover{border-color:rgba(61,184,90,.3);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.3);}
.prod-card:hover::after{opacity:1;}
.prod-card.in-cart{border-color:rgba(61,184,90,.5);background:rgba(61,184,90,.05);}
.prod-emoji{font-size:1.8rem;margin-bottom:10px;display:block;}
.prod-name{font-family:'Playfair Display',serif;font-size:.92rem;color:var(--text);margin-bottom:3px;line-height:1.3;}
.prod-cat{font-size:.65rem;color:var(--text3);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
.prod-price{font-family:'DM Mono',monospace;font-size:1rem;color:var(--gold);font-weight:500;}
.prod-unit{font-size:.65rem;color:var(--text3);margin-top:1px;}
.prod-actions{margin-top:12px;}
.btn-add{width:100%;background:linear-gradient(135deg,rgba(61,184,90,.15),rgba(61,184,90,.08));border:1px solid rgba(61,184,90,.3);border-radius:8px;color:var(--green);font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:500;padding:8px;cursor:pointer;transition:all.2s;}
.btn-add:hover{background:rgba(61,184,90,.25);}
.qty-ctrl{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.qty-btn{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text2);width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem;transition:all.15s;flex-shrink:0;}
.qty-btn:hover{border-color:var(--green);color:var(--green);}
.qty-val{font-family:'DM Mono',monospace;font-size:.88rem;color:var(--text);min-width:20px;text-align:center;}

/* ── PANIER MODAL ── */
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:flex-end;backdrop-filter:blur(4px);}
.cart-overlay.open{display:flex;}
.cart-sheet{width:100%;background:var(--bg2);border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow-y:auto;animation:slideUp.3s ease;}
.cart-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 20px;}
.cart-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--gold);margin-bottom:16px;}
.cart-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
.cart-item-name{font-size:.88rem;font-weight:500;margin-bottom:2px;}
.cart-item-sub{font-size:.72rem;color:var(--text2);font-family:'DM Mono',monospace;}
.cart-item-price{font-family:'DM Mono',monospace;font-size:.92rem;color:var(--gold);text-align:right;}
.cart-total-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0 4px;}
.cart-total-label{font-size:.88rem;color:var(--text2);}
.cart-total-val{font-family:'DM Mono',monospace;font-size:1rem;color:var(--gold);}
.cart-grand{display:flex;justify-content:space-between;align-items:center;padding:12px 0 20px;border-top:1px solid var(--border2);}
.cart-grand-label{font-family:'Playfair Display',serif;font-size:1rem;color:var(--text);}
.cart-grand-val{font-family:'DM Mono',monospace;font-size:1.2rem;color:var(--gold);font-weight:700;}

/* ── LIVRAISON FORM ── */
.delivery-section{background:var(--bg3);border-radius:var(--r);padding:16px;margin-bottom:14px;}
.del-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:12px;}
.del-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.del-field label{display:block;font-size:.68rem;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em;font-family:'DM Mono',monospace;}
.del-field input,.del-field select{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);font-family:'DM Sans',sans-serif;font-size:.84rem;padding:9px 12px;outline:none;transition:border-color.2s;-webkit-appearance:none;}
.del-field input:focus,.del-field select:focus{border-color:rgba(61,184,90,.4);}
.del-field.full{grid-column:1/-1;}

/* ── BOUTONS COMMANDE ── */
.order-btns{display:grid;grid-template-columns:1fr;gap:10px;margin-top:4px;}
.btn-wa{background:linear-gradient(135deg,#1da851,#25D366);border:none;border-radius:var(--r);color:#fff;font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:600;padding:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all.2s;box-shadow:0 4px 20px rgba(37,211,102,.25);}
.btn-wa:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(37,211,102,.4);}
.btn-wa:active{transform:scale(.98);}
.frais-info{font-size:.72rem;color:var(--text3);text-align:center;padding:8px 0;font-family:'DM Mono',monospace;}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:60px 20px;color:var(--text3);}
.empty-state.icon{font-size:3rem;margin-bottom:12px;display:block;}
.empty-state p{font-size:.88rem;line-height:1.7;}

/* ── TOAST ── */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--bg3);border:1px solid var(--border2);border-radius:30px;color:var(--text);font-size:.82rem;padding:10px 20px;z-index:999;transition:transform.3s ease;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.4);}
.toast.show{transform:translateX(-50%) translateY(0);}

/* ── LOADING ── */
.loading{text-align:center;padding:60px 20px;}
.spinner{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin.8s linear infinite;margin:0 auto 16px;}

/* ── ANIMATIONS ── */
@keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ── RESPONSIVE ── */
@media(max-width:400px){
 .products-grid{grid-template-columns:1fr 1fr;}
 .del-grid{grid-template-columns:1fr;}
}
</style>
</head>

const EMOJI_MAP = {
  'Épice':'🌶️','Fruit/Plante':'🌿','Liquide':'🫙','Graine':'🌱',
  'Miel':'🍯','Autre':'📦','default':'🌿'
};

let panier = {}; // {id: qty}
let produitsAll = [];
let filtreActif = 'Tous';
let searchTerm = '';

// ══ INIT ══
function init(){
  produitsAll = CATALOGUE_DATA.produits.filter(p => p.stock > 0);
  populerLieux();
  renderFormules();
  renderFilters();
  renderProduits();

  // Date min = aujourd'hui
  const d = document.getElementById('delDate');
  if(d) d.min = new Date().toISOString().split('T')[0];

  // Last update badge
  if(CATALOGUE_DATA.lastUpdate){
    const date = new Date(CATALOGUE_DATA.lastUpdate).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    document.querySelector('.hero-addr').innerHTML += ` <span style="font-size:.65rem;opacity:.6;margin-left:6px;">· Mis à jour ${date}</span>`;
  }
}

function populerLieux(){
  const sel = document.getElementById('delLieu');
  if(!sel) return;
  CATALOGUE_DATA.lieux.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l; opt.textContent = l;
    sel.appendChild(opt);
  });
}

// ══ FILTRES ══
function renderFilters(){
  const cats = ['Tous',...new Set(produitsAll.map(p => p.category).filter(Boolean))];
  const wrap = document.createElement('div');
  wrap.className = 'filters';
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (cat === filtreActif? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => { filtreActif = cat; renderFilters(); renderProduits(); };
    wrap.appendChild(btn);
  });
  const existing = document.querySelector('.filters');
  if(existing) existing.replaceWith(wrap);
  else document.getElementById('appContent').prepend(wrap);
}

// ══ FORMULES ══
function renderFormules(){
  const formules = CATALOGUE_DATA.formules;
  if(!formules?.length) return;

  const section = document.createElement('div');
  section.innerHTML = `<div class="section-title">💊 Formules recommandées</div>`;
  const scroll = document.createElement('div');
  scroll.className = 'formules-scroll';

  formules.forEach(f => {
    const card = document.createElement('div');
    card.className = 'formule-card';
    card.innerHTML = `
      <span class="formule-emoji">${f.emoji}</span>
      <div class="formule-name">${f.nom}</div>
      <div class="formule-desc">${f.desc}</div>
      <div class="formule-tags">${f.produits.map(p=>`<span class="formule-tag">${p}</span>`).join('')}</div>
      <button class="formule-apply" onclick="appliquerFormule(${f.id})">✨ Appliquer cette formule</button>
    `;
    scroll.appendChild(card);
  });

  section.appendChild(scroll);

  const content = document.getElementById('appContent');
  const grid = content.querySelector('.products-grid');
  if(grid) content.insertBefore(section, grid);
  else content.appendChild(section);
}

function appliquerFormule(id){
  const f = CATALOGUE_DATA.formules.find(x => x.id === id);
  if(!f) return;
  let ajouté = 0;
  f.produits.forEach(nom => {
    const p = produitsAll.find(x => x.name.toLowerCase() === nom.toLowerCase());
    if(p){ panier[p.id] = (panier[p.id] || 0) || 1; ajouté++; }
  });
  renderProduits();
  updateCartFab();
  toast(`✅ Formule "${f.nom}" ajoutée au panier`);
}

// ══ PRODUITS ══
function getEmoji(cat){ return EMOJI_MAP[cat] || EMOJI_MAP['default']; }

function renderProduits(){
  let liste = produitsAll;
  if(filtreActif!== 'Tous') liste = liste.filter(p => p.category === filtreActif);
  if(searchTerm) liste = liste.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()));

  const content = document.getElementById('appContent');
  let grid = content.querySelector('.products-grid');
  if(!grid){
    grid = document.createElement('div');
    grid.className = 'products-grid';
    content.appendChild(grid);
  }

  if(liste.length === 0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><span class="icon">🌿</span><p>Aucun produit disponible<br>dans cette catégorie.</p></div>`;
    return;
  }

  grid.innerHTML = '';
  liste.forEach((p, i) => {
    const qty = panier[p.id] || 0;
    const inCart = qty > 0;
    const card = document.createElement('div');
    card.className = 'prod-card' + (inCart? ' in-cart' : '');
    card.style.animationDelay = (i * 0.04) + 's';
    card.innerHTML = `
      <span class="prod-emoji">${getEmoji(p.category)}</span>
      <div class="prod-name">${p.name}</div>
      <div class="prod-cat">${p.category || ''}</div>
      <div class="prod-price">${(p.sellPrice||0).toLocaleString('fr-FR')} FCFA</div>
      <div class="prod-unit">/ ${p.uniteCatalogue || 'sachet'}</div>
      <div class="prod-actions">
        ${inCart
         ? `<div class="qty-ctrl">
               <button class="qty-btn" onclick="event.stopPropagation(); changeQty(${p.id},-1)">−</button>
               <span class="qty-val">${qty}</span
