<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#050f06;--bg2:#0a1a0b;--bg3:#0f230f;
  --gold:#c9a84c;--green:#3db85a;--green2:#2d8f44;
  --text:#e8f0e9;--text2:#8fa88f;--text3:#4a6b4c;
  --border:rgba(255,255,255,.07);--border2:rgba(201,168,76,.2);
  --r:14px;--r2:8px;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh;overflow-x:hidden;}
.hero{text-align:center;padding:50px 20px 30px;}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(61,184,90,.1);border:1px solid rgba(61,184,90,.25);border-radius:30px;padding:5px 14px;font-size:.7rem;font-family:"DM Mono",monospace;color:var(--green);letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px;}
.hero-logo{font-size:2.8rem;margin-bottom:10px;display:block;}
.hero-title{font-family:"Playfair Display",serif;font-size:clamp(1.8rem,6vw,2.6rem);font-weight:700;color:var(--gold);margin-bottom:6px;}
.hero-sub{font-size:.85rem;color:var(--text2);margin-bottom:4px;}
.hero-addr{font-size:.7rem;color:var(--text3);font-family:"DM Mono",monospace;}
.search-wrap{max-width:480px;margin:20px auto;padding:0 20px;}
.search-box{position:relative;}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:.85rem;pointer-events:none;z-index:1;}
.search-box input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:50px;color:var(--text);font-family:"DM Sans",sans-serif;font-size:.88rem;padding:12px 20px 12px 44px;outline:none;}
.search-box input:focus{border-color:rgba(61,184,90,.4);}
.filters{display:flex;gap:8px;padding:0 20px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.filter-btn{flex-shrink:0;background:var(--bg2);border:1px solid var(--border);border-radius:30px;color:var(--text2);font-size:.76rem;padding:7px 16px;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:"DM Sans",sans-serif;}
.filter-btn.active,.filter-btn:hover{background:rgba(61,184,90,.12);border-color:rgba(61,184,90,.35);color:var(--green);}
.section-title{font-family:"Playfair Display",serif;font-size:1.05rem;color:var(--gold);padding:0 20px;margin-bottom:12px;}
.formules-scroll{display:flex;gap:12px;padding:0 20px 4px;overflow-x:auto;scrollbar-width:none;margin-bottom:28px;}
.formules-scroll::-webkit-scrollbar{display:none;}
.formule-card{flex-shrink:0;width:175px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:14px;}
.formule-emoji{font-size:1.5rem;margin-bottom:8px;display:block;}
.formule-name{font-family:"Playfair Display",serif;font-size:.86rem;color:var(--gold);margin-bottom:4px;}
.formule-desc{font-size:.7rem;color:var(--text2);line-height:1.5;margin-bottom:8px;}
.formule-tags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px;}
.formule-tag{font-size:.6rem;background:rgba(61,184,90,.1);border:1px solid rgba(61,184,90,.2);color:var(--green);border-radius:20px;padding:2px 6px;}
.formule-apply{width:100%;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.25);border-radius:6px;color:var(--gold);font-family:"DM Sans",sans-serif;font-size:.72rem;font-weight:500;padding:6px;cursor:pointer;}
.formule-apply:hover{background:rgba(201,168,76,.2);}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;padding:0 20px;margin-bottom:100px;}
.prod-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;transition:all .2s;}
.prod-card:hover{border-color:rgba(61,184,90,.3);transform:translateY(-2px);}
.prod-card.in-cart{border-color:rgba(61,184,90,.5);background:rgba(61,184,90,.05);}
.prod-emoji{font-size:1.7rem;margin-bottom:8px;display:block;}
.prod-name{font-family:"Playfair Display",serif;font-size:.9rem;margin-bottom:3px;line-height:1.3;}
.prod-cat{font-size:.63rem;color:var(--text3);font-family:"DM Mono",monospace;text-transform:uppercase;margin-bottom:8px;}
.prod-price{font-family:"DM Mono",monospace;font-size:.95rem;color:var(--gold);}
.prod-unit{font-size:.63rem;color:var(--text3);margin-top:1px;margin-bottom:10px;}
.btn-add{width:100%;background:linear-gradient(135deg,rgba(61,184,90,.15),rgba(61,184,90,.08));border:1px solid rgba(61,184,90,.3);border-radius:8px;color:var(--green);font-family:"DM Sans",sans-serif;font-size:.78rem;font-weight:500;padding:8px;cursor:pointer;transition:all .2s;}
.btn-add:hover{background:rgba(61,184,90,.25);}
.btn-add:active{transform:scale(.97);}
.qty-ctrl{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.qty-btn{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text2);width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;transition:all .15s;flex-shrink:0;font-family:"DM Sans",sans-serif;}
.qty-btn:hover{border-color:var(--green);color:var(--green);}
.qty-val{font-family:"DM Mono",monospace;font-size:.9rem;min-width:22px;text-align:center;}
.cart-fab{position:fixed;bottom:24px;right:20px;z-index:100;background:linear-gradient(135deg,var(--green2),var(--green));border:none;border-radius:50px;color:#fff;font-family:"DM Sans",sans-serif;font-weight:500;font-size:.88rem;padding:13px 20px;cursor:pointer;box-shadow:0 8px 32px rgba(61,184,90,.35);display:flex;align-items:center;gap:8px;display:none;}
.cart-count{background:var(--gold);color:#050f06;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;font-family:"DM Mono",monospace;}
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:flex-end;backdrop-filter:blur(4px);}
.cart-overlay.open{display:flex;}
.cart-sheet{width:100%;background:var(--bg2);border-radius:20px 20px 0 0;padding:20px;max-height:88vh;overflow-y:auto;}
.cart-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px;}
.cart-title{font-family:"Playfair Display",serif;font-size:1.15rem;color:var(--gold);margin-bottom:14px;}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.cart-item-name{font-size:.86rem;font-weight:500;}
.cart-item-sub{font-size:.7rem;color:var(--text2);font-family:"DM Mono",monospace;margin-top:2px;}
.cart-item-price{font-family:"DM Mono",monospace;font-size:.9rem;color:var(--gold);}
.cart-row{display:flex;justify-content:space-between;padding:10px 0 4px;font-size:.86rem;}
.cart-row-lbl{color:var(--text2);}
.cart-grand{display:flex;justify-content:space-between;align-items:center;padding:12px 0 16px;border-top:1px solid var(--border2);margin-top:4px;}
.cart-grand-lbl{font-family:"Playfair Display",serif;font-size:.98rem;}
.cart-grand-val{font-family:"DM Mono",monospace;font-size:1.15rem;color:var(--gold);font-weight:700;}
.del-section{background:var(--bg3);border-radius:var(--r);padding:14px;margin-bottom:14px;}
.del-title{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);font-family:"DM Mono",monospace;margin-bottom:10px;}
.del-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.del-field label{display:block;font-size:.66rem;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em;font-family:"DM Mono",monospace;}
.del-field input,.del-field select{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);font-family:"DM Sans",sans-serif;font-size:.84rem;padding:9px 11px;outline:none;-webkit-appearance:none;}
.del-field.full{grid-column:1/-1;}
.btn-wa{width:100%;background:linear-gradient(135deg,#1da851,#25D366);border:none;border-radius:var(--r);color:#fff;font-family:"DM Sans",sans-serif;font-size:.95rem;font-weight:600;padding:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;}
.btn-wa:hover{opacity:.92;}
.frais-info{font-size:.7rem;color:var(--text3);text-align:center;padding:8px 0;font-family:"DM Mono",monospace;}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--bg3);border:1px solid var(--border2);border-radius:30px;color:var(--text);font-size:.82rem;padding:10px 20px;z-index:999;transition:transform .3s ease;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.empty-state{text-align:center;padding:50px 20px;color:var(--text3);}
.empty-state .icon{font-size:2.8rem;margin-bottom:12px;display:block;}
@media(max-width:380px){.products-grid{grid-template-columns:1fr 1fr;}.del-grid{grid-template-columns:1fr;}}
</style>
</head>

var panier = {};
var filtreActif = "Tous";
var searchTerm = "";

var EMOJI = {"Épice":"🌶️","Fruit/Plante":"🌿","Liquide":"🫙","Graine":"🌱","Miel":"🍯","Autre":"📦"};
function emo(cat){ return EMOJI[cat] || "🌿"; }

function init(){
  // Coordonnées dynamiques
  var phEl=document.getElementById("heroPhoneTxt"); if(phEl && D.shopPhone) phEl.textContent=D.shopPhone;
  var adEl=document.getElementById("heroAddrTxt"); if(adEl && D.shopAddr) adEl.textContent=D.shopAddr;
  // Lieux
  var sel = document.getElementById("delLieu");
  (D.lieux||[]).forEach(function(l){ var o=document.createElement("option"); o.value=l; o.textContent=l; sel.appendChild(o); });
  // Date min
  var dd = document.getElementById("delDate");
  if(dd) dd.min = new Date().toISOString().split("T")[0];
  // Last update
  if(D.lastUpdate){
    var dt = new Date(D.lastUpdate).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
    document.getElementById("heroAddr").innerHTML += " <span style=\"font-size:.6rem;opacity:.6\">· Mis à jour "+dt+"</span>";
  }
  // Filtres
  renderFilters();
  // Formules
  renderFormules();
  // Produits
  renderProduits();
  // Search
  document.getElementById("searchInput").addEventListener("input", function(){ searchTerm=this.value; renderProduits(); });
}

function renderFilters(){
  var cats = ["Tous"].concat([...new Set((D.produits||[]).filter(p=>p.stock>0).map(p=>p.category).filter(Boolean))]);
  var wrap = document.getElementById("filtersWrap");
  wrap.innerHTML = "";
  var div = document.createElement("div"); div.className="filters";
  cats.forEach(function(cat){
    var btn = document.createElement("button");
    btn.className = "filter-btn" + (cat===filtreActif?" active":"");
    btn.textContent = cat;
    btn.addEventListener("click", function(){ filtreActif=cat; renderFilters(); renderProduits(); });
    div.appendChild(btn);
  });
  wrap.appendChild(div);
}

function renderFormules(){
  var sec = document.getElementById("formulesSec");
  if(!D.formules||!D.formules.length){ sec.innerHTML=""; return; }
  var html = "<div class=\"section-title\">💊 Formules recommandées</div><div class=\"formules-scroll\">";
  D.formules.forEach(function(f){
    html += "<div class=\"formule-card\">";
    html += "<span class=\"formule-emoji\">"+f.emoji+"</span>";
    html += "<div class=\"formule-name\">"+f.nom+"</div>";
    html += "<div class=\"formule-desc\">"+f.desc+"</div>";
    html += "<div class=\"formule-tags\">"+(f.produits||[]).map(function(p){ return "<span class=\"formule-tag\">"+p+"</span>"; }).join("")+"</div>";
    html += "<button class=\"formule-apply\" onclick=\"appliquerFormule("+f.id+")\">✨ Appliquer</button>";
    html += "</div>";
  });
  html += "</div>";
  sec.innerHTML = html;
}

function appliquerFormule(id){
  var f = (D.formules||[]).find(function(x){ return x.id===id; });
  if(!f) return;
  (f.produits||[]).forEach(function(nom){
    var p = (D.produits||[]).find(function(x){ return x.name===nom && x.stock>0; });
    if(p) panier[p.id] = panier[p.id] || 1;
  });
  renderProduits(); updateFab();
  toast("✅ Formule "+f.nom+" ajoutée");
}

function getFormats(p){
  // Retourne les formats disponibles pour ce produit
  var conds = (D.conditionnements||[]).filter(function(c){ return c.prodId===p.id; });
  if(conds.length>0) return conds.map(function(c){ return {format:c.format,qte:c.qte,prix:c.prix,key:p.id+"_"+c.format}; });
  return [{format:p.uniteCatalogue||"sachet",qte:"",prix:p.sellPrice||0,key:p.id+"_0"}];
}

function renderProduits(){
  var grid = document.getElementById("grid");
  var liste = (D.produits||[]).filter(function(p){ return p.stock>0; });
  if(filtreActif!=="Tous") liste = liste.filter(function(p){ return p.category===filtreActif; });
  if(searchTerm) liste = liste.filter(function(p){ return p.name.toLowerCase().includes(searchTerm.toLowerCase()); });
  if(!liste.length){ grid.innerHTML="<div class=\"empty-state\" style=\"grid-column:1/-1\"><span class=\"icon\">🌿</span><p>Aucun produit disponible.</p></div>"; return; }
  grid.innerHTML = "";
  liste.forEach(function(p, i){
    var formats = getFormats(p);
    var inCart = formats.some(function(f){ return (panier[f.key]||0)>0; });
    var card = document.createElement("div");
    card.className = "prod-card"+(inCart?" in-cart":"");
    card.style.animationDelay = (i*0.04)+"s";

    // Image ou emoji
    var mediaHtml = p.photo
      ? "<img src=\""+p.photo+"\" style=\"width:100%;height:120px;object-fit:cover;border-radius:10px 10px 0 0;margin:-14px -14px 10px -14px;width:calc(100% + 28px);\" onerror=\"this.style.display='none';\">"
      : "<span class=\"prod-emoji\">"+emo(p.category)+"</span>";

    // Description
    var descHtml = p.description
      ? "<div style=\"font-size:.68rem;color:#8fa88f;line-height:1.4;margin-bottom:8px;\">"+p.description+"</div>"
      : "";

    // Formats
    var formatsHtml = "";
    if(formats.length===1){
      var f=formats[0]; var qty=panier[f.key]||0;
      formatsHtml += "<div class=\"prod-price\">"+((f.prix||0).toLocaleString("fr-FR"))+" FCFA</div>";
      formatsHtml += "<div class=\"prod-unit\">/ "+f.format+(f.qte?" "+f.qte:"")+"</div>";
      if(qty>0){
        formatsHtml += "<div class=\"qty-ctrl\" style=\"margin-top:8px;\"><button class=\"qty-btn\" onclick=\"chQty('"+f.key+"',-1)\">−</button><span class=\"qty-val\">"+qty+"</span><button class=\"qty-btn\" onclick=\"chQty('"+f.key+"',1)\">+</button></div>";
      } else {
        formatsHtml += "<button class=\"btn-add\" style=\"margin-top:8px;\" onclick=\"addCart('"+f.key+"',"+p.id+")\">+ Ajouter</button>";
      }
    } else {
      formatsHtml += "<div style=\"font-size:.68rem;color:#4a6b4c;margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em;\">Choisir un format</div>";
      formats.forEach(function(f){
        var qty=panier[f.key]||0;
        formatsHtml += "<div style=\"display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-top:1px solid rgba(255,255,255,.05);\">";
        formatsHtml += "<div><span style=\"font-size:.78rem;color:#3db85a;font-weight:500;\">"+f.format+(f.qte?" "+f.qte:"")+"</span><span style=\"font-family:'DM Mono',monospace;font-size:.8rem;color:#c9a84c;margin-left:6px;\">"+((f.prix||0).toLocaleString("fr-FR"))+" F</span></div>";
        if(qty>0){
          formatsHtml += "<div style=\"display:flex;align-items:center;gap:4px;\"><button class=\"qty-btn\" style=\"width:24px;height:24px;\" onclick=\"chQty('"+f.key+"',-1)\">−</button><span class=\"qty-val\" style=\"font-size:.8rem;min-width:16px;\">"+qty+"</span><button class=\"qty-btn\" style=\"width:24px;height:24px;\" onclick=\"chQty('"+f.key+"',1)\">+</button></div>";
        } else {
          formatsHtml += "<button style=\"background:rgba(61,184,90,.15);border:1px solid rgba(61,184,90,.3);border-radius:6px;color:#3db85a;font-size:.7rem;padding:3px 8px;cursor:pointer;\" onclick=\"addCart('"+f.key+"',"+p.id+")\"">+ Ajouter</button>";
        }
        formatsHtml += "</div>";
      });
    }

    card.innerHTML = mediaHtml+"<div class=\"prod-name\">"+p.name+"</div><div class=\"prod-cat\">"+(p.category||"")+"</div>"+descHtml+formatsHtml;
    grid.appendChild(card);
  });
}

function addCart(key, prodId){
  panier[key]=1; renderProduits(); updateFab();
  var p=(D.produits||[]).find(function(x){return x.id===(prodId||parseInt(key));});
  toast("🌿 "+(p?p.name:"")+" ajouté");
}

function chQty(key, delta){
  var n=(panier[key]||0)+delta;
  if(n<=0) delete panier[key]; else panier[key]=n;
  renderProduits(); updateFab();
}

function updateFab(){
  var total=Object.values(panier).reduce(function(s,q){return s+q;},0);
  var fab=document.getElementById("cartFab");
  var cnt=document.getElementById("cartCount");
  fab.style.display=total>0?"flex":"none";
  cnt.textContent=total;
}

function openCart(){
  renderCartSheet();
  document.getElementById("cartOverlay").classList.add("open");
  document.body.style.overflow="hidden";
}

function closeCart(){
  document.getElementById("cartOverlay").classList.remove("open");
  document.body.style.overflow="";
}

document.getElementById("cartOverlay").addEventListener("click",function(e){ if(e.target===this) closeCart(); });

function getItemFromKey(key, qty){
  var parts=key.split("_");
  var pid=parseInt(parts[0]);
  var p=(D.produits||[]).find(function(x){return x.id===pid;});
  if(!p) return null;
  var formats=getFormats(p);
  var fmt=formats.find(function(f){return f.key===key;})||formats[0];
  return {p:p,qty:qty,format:fmt.format,qte:fmt.qte,prix:fmt.prix};
}

function renderCartSheet(){
  var items=Object.entries(panier).map(function(e){ return getItemFromKey(e[0],e[1]); }).filter(Boolean);
  var sT=items.reduce(function(s,x){return s+(x.prix||0)*x.qty;},0);
  var fr=(D.frais||{}).simple||500;
  var tot=sT+fr;
  document.getElementById("cartItems").innerHTML=items.map(function(x){
    return "<div class=\"cart-item\"><div><div class=\"cart-item-name\">"+x.p.name+"</div><div class=\"cart-item-sub\">"+x.qty+" × "+((x.prix||0).toLocaleString("fr-FR"))+" FCFA / "+x.format+(x.qte?" "+x.qte:"")+"</div></div><div class=\"cart-item-price\">"+((x.prix||0)*x.qty).toLocaleString("fr-FR")+" F</div></div>";
  }).join("");
  document.getElementById("cartSummary").innerHTML="<div class=\"cart-row\"><span class=\"cart-row-lbl\">Sous-total</span><span>"+sT.toLocaleString("fr-FR")+" FCFA</span></div><div class=\"cart-row\"><span class=\"cart-row-lbl\">Livraison</span><span style=\"color:var(--text2)\">"+fr.toLocaleString("fr-FR")+" FCFA</span></div><div class=\"cart-grand\"><span class=\"cart-grand-lbl\">Total</span><span class=\"cart-grand-val\">"+tot.toLocaleString("fr-FR")+" FCFA</span></div>";
}

function envoyerCommande(){
  var items=Object.entries(panier).map(function(e){ return getItemFromKey(e[0],e[1]); }).filter(function(x){ return x&&x.qty>0; }).map(function(x){ return {nom:x.p.name,prix:x.prix,qty:x.qty,unit:x.format+(x.qte?" "+x.qte:"")}; });
  if(!items.length){toast("⚠️ Panier vide");return;}
  var nom=document.getElementById("delNom").value.trim();
  var tel=document.getElementById("delTel").value.trim();
  var lieu=document.getElementById("delLieu").value;
  var date=document.getElementById("delDate").value;
  var heure=document.getElementById("delHeure").value;
  var note=document.getElementById("delNote").value.trim();
  if(!nom){toast("⚠️ Entrez votre nom");return;}
  if(!lieu){toast("⚠️ Choisissez un lieu");return;}
  var sT=items.reduce(function(s,it){return s+it.prix*it.qty;},0);
  var fr=(D.frais||{}).simple||500;
  var tot=sT+fr;
  var slogan=D.shopSlogan||"la nature au service de tous";
  var phone=(D.shopPhone||"653791333").replace(/[^0-9]/g,"");
  var lignes=items.map(function(it){return "• "+it.nom+" ×"+it.qty+" — "+(it.prix*it.qty).toLocaleString("fr-FR")+" FCFA";}).join("\n");
  var msg="🌿 *COMMANDE U-Santé & Nature*\n\n👤 *"+nom+"*"+(tel?"\n📱 "+tel:"")+"\n\n📦 *Produits :*\n"+lignes+"\n\n💰 Sous-total : "+sT.toLocaleString("fr-FR")+" FCFA\n🚚 Livraison : "+fr.toLocaleString("fr-FR")+" FCFA\n✅ *TOTAL : "+tot.toLocaleString("fr-FR")+" FCFA*\n\n📍 "+lieu+"\n📅 "+(date||"Date à définir")+" à "+heure+(note?"\n📝 "+note:"")+"\n\n_"+slogan+"_ 🌿";

  // Enregistrement automatique côté admin via GitHub Issues (best-effort, non bloquant)
  enregistrerCommandeWeb({nom:nom,tel:tel,items:items,sT:sT,fr:fr,tot:tot,lieu:lieu,date:date,heure:heure,note:note});

  window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(msg),"_blank");
  closeCart();
  toast("📲 Redirection WhatsApp…");
}

function enregistrerCommandeWeb(o){
  if(!D.ghUser||!D.ghRepo||!D.issuesToken) return; // synchro non configurée, on ne bloque rien
  try{
    var orderData={
      id: Date.now(),
      clientNom: o.nom, clientTel: o.tel, clientCode:"", clientId:null,
      items: o.items.map(function(it){ return {nom:it.nom, qty:it.qty, prix:it.prix, format:it.unit}; }),
      sousTotal: o.sT, fraisLivraison: o.fr, total: o.tot,
      lieu: o.lieu, livraisonDate: o.date, livraisonHeure: o.heure, note: o.note,
      status: "pending", ts: Date.now(), source: "web"
    };
    var body = "Commande automatique du catalogue en ligne — ne pas modifier manuellement.\n\n```json\n"+JSON.stringify(orderData)+"\n```";
    fetch("https://api.github.com/repos/"+D.ghUser+"/"+D.ghRepo+"/issues", {
      method: "POST",
      headers: {
        "Authorization": "token "+D.issuesToken,
        "Accept": "application/vnd.github.v3+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        title: "🛒 Commande web — "+o.nom+" — "+new Date().toLocaleString("fr-FR"),
        body: body,
        labels: ["commande"]
      })
    }).catch(function(){ /* silencieux : WhatsApp reste le canal fiable */ });
  }catch(e){ /* silencieux */ }
}

function toast(msg){
  var el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(el._t); el._t=setTimeout(function(){el.classList.remove("show");},2800);
}

document.addEventListener("DOMContentLoaded", function(){ init(); });

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
